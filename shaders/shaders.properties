# CozyLite 2.0 — настройки OptiFine / Iris Shaders
# Composite1 работает в половинном разрешении: bloom дешевле примерно в 4 раза.
size.buffer.colortex4=0.5 0.5
noiseTextureResolution=256
oldLighting=false
clouds=off
shadowTranslucent=true
underwaterOverlay=false
sun=false
moon=false
stars=true
vignette=false

# Не очищать HDR-буфер до чтения final; остальные очищаются автоматически.
clear.colortex3=true
clear.colortex4=true

screen=<profile> [SKY] [LIGHTING] [WATER] [EFFECTS] [PERFORMANCE]
screen.columns=2
screen.SKY=VOLUMETRIC_CLOUDS CLOUD_SCALE CLOUD_COVERAGE CLOUD_STEPS FOG_STRENGTH
screen.SKY.columns=2
screen.LIGHTING=GOD_RAYS GODRAY_INTENSITY GODRAY_DECAY SOFT_SHADOWS shadowMapResolution shadowDistance SHADOW_FILTER LEAF_SSS
screen.LIGHTING.columns=2
screen.WATER=WATER_REFLECTIONS WATER_QUALITY WET_SURFACES WAVING_FOLIAGE WAVE_STRENGTH EMISSIVE_STRENGTH
screen.WATER.columns=2
screen.EFFECTS=BLOOM BLOOM_INTENSITY SSR SSAO SSAO_QUALITY DOF DOF_STRENGTH MOTION_BLUR MOTION_BLUR_STRENGTH FXAA EXPOSURE SATURATION
screen.EFFECTS.columns=2
screen.PERFORMANCE=QUALITY_PRESET HD_ASSETS CLOUD_STEPS GODRAY_SAMPLES BLOOM_QUALITY shadowMapResolution shadowDistance SHADOW_FILTER WATER_QUALITY SSAO_QUALITY
screen.PERFORMANCE.columns=2

sliders=CLOUD_SCALE CLOUD_COVERAGE CLOUD_STEPS GODRAY_INTENSITY GODRAY_DECAY GODRAY_SAMPLES BLOOM_INTENSITY BLOOM_QUALITY FOG_STRENGTH shadowMapResolution shadowDistance SHADOW_FILTER WATER_QUALITY SSAO_QUALITY DOF_STRENGTH MOTION_BLUR_STRENGTH WAVE_STRENGTH EMISSIVE_STRENGTH EXPOSURE SATURATION

profile.Potato=!HD_ASSETS QUALITY_PRESET:0 !VOLUMETRIC_CLOUDS !GOD_RAYS SOFT_SHADOWS !BLOOM WATER_REFLECTIONS !VOLUMETRIC_FOG !WET_SURFACES !SSR !SSAO !DOF !MOTION_BLUR !LEAF_SSS CLOUD_STEPS:4 GODRAY_SAMPLES:8 BLOOM_QUALITY:0 SHADOW_FILTER:0 WATER_QUALITY:0 shadowMapResolution:512 shadowDistance:48.0 !WAVING_FOLIAGE FXAA EXPOSURE:1.0 SATURATION:1.0
profile.Fast=!HD_ASSETS QUALITY_PRESET:1 VOLUMETRIC_CLOUDS GOD_RAYS SOFT_SHADOWS BLOOM WATER_REFLECTIONS VOLUMETRIC_FOG WET_SURFACES !SSR !SSAO !DOF !MOTION_BLUR !LEAF_SSS CLOUD_STEPS:4 GODRAY_SAMPLES:12 BLOOM_QUALITY:0 SHADOW_FILTER:0 WATER_QUALITY:0 shadowMapResolution:512 shadowDistance:64.0 WAVING_FOLIAGE FXAA EXPOSURE:1.0 SATURATION:1.05
profile.Balanced=!HD_ASSETS QUALITY_PRESET:2 VOLUMETRIC_CLOUDS GOD_RAYS SOFT_SHADOWS BLOOM WATER_REFLECTIONS VOLUMETRIC_FOG WET_SURFACES !SSR !SSAO !DOF !MOTION_BLUR LEAF_SSS CLOUD_STEPS:8 GODRAY_SAMPLES:16 BLOOM_QUALITY:1 SHADOW_FILTER:1 WATER_QUALITY:1 shadowMapResolution:1024 shadowDistance:96.0 WAVING_FOLIAGE FXAA EXPOSURE:1.0 SATURATION:1.08
profile.Pretty=HD_ASSETS QUALITY_PRESET:3 VOLUMETRIC_CLOUDS GOD_RAYS SOFT_SHADOWS BLOOM WATER_REFLECTIONS VOLUMETRIC_FOG WET_SURFACES SSR SSAO !DOF !MOTION_BLUR LEAF_SSS CLOUD_STEPS:10 GODRAY_SAMPLES:20 BLOOM_QUALITY:2 SHADOW_FILTER:2 WATER_QUALITY:2 SSAO_QUALITY:1 shadowMapResolution:1024 shadowDistance:128.0 WAVING_FOLIAGE FXAA EXPOSURE:1.0 SATURATION:1.08
profile.Ultra=HD_ASSETS QUALITY_PRESET:4 VOLUMETRIC_CLOUDS GOD_RAYS SOFT_SHADOWS BLOOM WATER_REFLECTIONS VOLUMETRIC_FOG WET_SURFACES SSR SSAO DOF MOTION_BLUR LEAF_SSS CLOUD_STEPS:14 GODRAY_SAMPLES:24 BLOOM_QUALITY:2 SHADOW_FILTER:2 WATER_QUALITY:2 SSAO_QUALITY:2 shadowMapResolution:2048 shadowDistance:160.0 WAVING_FOLIAGE FXAA EXPOSURE:1.0 SATURATION:1.08

#ifdef HD_ASSETS
texture.composite.cloudBaseTex=textures/cloud_base.png
texture.composite.cloudDetailTex=textures/cloud_detail.png
texture.composite.weatherMapTex=textures/weather_map.png
texture.composite.blueNoiseTex=textures/blue_noise.png
texture.gbuffers.cloudBaseTex=textures/cloud_base.png
texture.gbuffers.cloudDetailTex=textures/cloud_detail.png
texture.gbuffers.weatherMapTex=textures/weather_map.png
texture.gbuffers.waterNormalsTex=textures/water_normals.png
#endif
